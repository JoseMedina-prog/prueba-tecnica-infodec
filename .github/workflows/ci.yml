name: CI Pasabordo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: travel_app_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP y extensiones
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, sodium, mbstring
          coverage: none

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configurar entorno seguro de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate
          php -r "file_put_contents('.env', preg_replace('/APP_TOKEN_SECRET=.*/', 'APP_TOKEN_SECRET=' . base64_encode(random_bytes(32)), file_get_contents('.env')));"
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=travel_app_test/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env

      - name: Ejecutar pruebas PHPUnit
        run: vendor/bin/phpunit

      - name: Auditar dependencias de PHP
        run: composer audit

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias npm
        run: npm ci

      - name: Compilar aplicación Angular
        run: npx ng build

      - name: Ejecutar pruebas unitarias de Angular (ChromeHeadless)
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Auditar dependencias npm de producción
        run: npm audit --omit=dev --audit-level=high
